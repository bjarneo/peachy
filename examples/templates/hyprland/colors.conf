# Peachy generated colors for Hyprland
# Source this in your hyprland.conf: source = ~/.config/hypr/peachy-colors.conf

$peachy_background = rgb({background.strip})
$peachy_foreground = rgb({foreground.strip})
$peachy_black = rgb({black.strip})
$peachy_red = rgb({red.strip})
$peachy_green = rgb({green.strip})
$peachy_yellow = rgb({yellow.strip})
$peachy_blue = rgb({blue.strip})
$peachy_magenta = rgb({magenta.strip})
$peachy_cyan = rgb({cyan.strip})
$peachy_white = rgb({white.strip})
$peachy_bright_black = rgb({bright_black.strip})
$peachy_bright_yellow = rgb({bright_yellow.strip})

# Border colors
$activeBorderColor = $peachy_blue

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $peachy_bright_black
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $peachy_bright_black
}
