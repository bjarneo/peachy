# Peachy generated colors for Kitty
# Include this in kitty.conf: include peachy-colors.conf

foreground {foreground}
background {background}

# Cursor
cursor {foreground}
cursor_text_color {background}

# Selection
selection_foreground {background}
selection_background {blue}

# Normal colors
color0 {black}
color1 {red}
color2 {green}
color3 {yellow}
color4 {blue}
color5 {magenta}
color6 {cyan}
color7 {white}

# Bright colors
color8 {bright_black}
color9 {bright_red}
color10 {bright_green}
color11 {bright_yellow}
color12 {bright_blue}
color13 {bright_magenta}
color14 {bright_cyan}
color15 {bright_white}

# Tab bar
active_tab_foreground {background}
active_tab_background {blue}
inactive_tab_foreground {white}
inactive_tab_background {bright_black}
